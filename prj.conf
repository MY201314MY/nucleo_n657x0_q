# LOG
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# UART
CONFIG_UART_ASYNC_API=y
CONFIG_NOCACHE_MEMORY=y

# XSPI/MSPI/QSPI
CONFIG_MSPI=y

# SHELL
CONFIG_SHELL=y
CONFIG_SHELL_ASYNC_API=y
CONFIG_SHELL_STACK_SIZE=10240
CONFIG_SHELL_PROMPT_UART="nucleo_n657x0_q: "
CONFIG_SHELL_BACKEND_SERIAL_ASYNC_RX_BUFFER_COUNT=8
CONFIG_SHELL_BACKEND_SERIAL_ASYNC_RX_BUFFER_SIZE=64

# REBOOT
CONFIG_REBOOT=y

# RTC
CONFIG_RTC=y
CONFIG_RTC_SHELL=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
